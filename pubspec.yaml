name: imsakia
description: "A professional Islamic Imsakia and Quran app with global prayer times."
publish_to: 'none'

version: 1.2.1+7

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management & Settings
  provider: ^6.1.2
  shared_preferences: ^2.5.4
  
  # UI & Fonts
  google_fonts: ^8.0.2
  flutter_svg: ^2.0.14
  cached_network_image: ^3.4.1
  
  # Islamic Core Logic
  adhan: ^2.0.0+1
  hijri: ^3.0.0
  quran: ^1.3.3
  intl: ^0.20.2
  
  # Networking & Connectivity (إضافات ضرورية للتحديث التلقائي والعالمية)
  http: ^1.3.0
  connectivity_plus: ^6.1.0
  dio: ^5.9.1
  
  # Location (لجلب المدن تلقائياً وضمان دقة المواقيت عالمياً)
  geolocator: ^13.0.2
  geocoding: ^4.0.0
  
  # Local Storage & Database
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.3
  sqlite3: ^2.4.0
  path_provider: ^2.1.5
  path: ^1.9.1
  
  # Background Tasks & Audio
  workmanager: ^0.9.0+3
  flutter_background_service: ^5.0.10
  audioplayers: ^5.2.1
  android_alarm_manager_plus: ^4.0.4
  
  # UI Helpers
  scrollable_positioned_list: ^0.3.8
  xml: ^6.5.0
  device_info_plus: ^12.1.0
  change_app_package_name: ^1.0.2

  # Local packages
  digital_tasbih:
    path: ./packages/digital_tasbih
  csc_picker_plus: ^0.0.3
  timezone: ^0.11.0
  visibility_detector: ^0.4.0+2
  wakelock_plus: ^1.4.0
  font_awesome_flutter: ^10.12.0
  animate_do: ^4.2.0
  flutter_screenutil: ^5.9.3
  easy_localization: ^3.0.8
  back_button_interceptor: ^8.0.4
  fluttericon: ^2.0.0
  adhan_dart: ^1.2.0
  table_calendar: ^3.2.0
  radio_player: ^2.2.1
  lottie: ^3.3.2
  easy_container: ^1.0.5+1
  url_launcher: ^6.3.2
  audio_session: ^0.2.2
  audio_service: ^0.18.18
  permission_handler: ^12.0.1
  flutter_local_notifications: ^21.0.0
  just_audio: ^0.10.5
  home_widget: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/quran.db
    - assets/data/
    - assets/images/duas.png
    - assets/images/muhammed.png
    - assets/images/names.svg
    - assets/images/quraan.png
    - assets/images/kaaba.png
    - assets/images/nameborder.png
    - assets/images/Madinah.png
    - assets/images/Makkah.png
    - assets/images/aya_number.png
    - assets/images/fateha_image.png
    - assets/images/quranlogo.png
    - assets/images/sura_hedder.png
    - assets/images/fajr_dawn.png
    - assets/images/dhuhr_noon.png
    - assets/images/asr_afternoon.png
    - assets/images/maghrib_sunset.png
    - assets/images/isha_night.png
    - assets/images/events/
    - assets/audio/
    - assets/fonts/

  fonts:
    - family: HafsSmart
      fonts:
        - asset: assets/fonts/HafsSmart_08.ttf
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi-Regular.ttf
        - asset: assets/fonts/ReemKufi-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: UthmanTN
      fonts:
        - asset: assets/fonts/UthmanTN1-Regular.ttf