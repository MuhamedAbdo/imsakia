name: imsakia
description: "A professional Islamic Imsakia and Quran app with global prayer times."
publish_to: 'none'

version: 1.1.1+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management & Settings
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  
  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.14
  cached_network_image: ^3.4.1
  
  # Islamic Core Logic
  adhan: ^2.0.0+1
  hijri: ^3.0.0
  quran: ^1.3.3
  intl: ^0.20.2
  
  # Networking & Connectivity (إضافات ضرورية للتحديث التلقائي والعالمية)
  http: ^1.3.0
  connectivity_plus: ^6.1.0
  dio: ^5.4.3+1
  
  # Location (لجلب المدن تلقائياً وضمان دقة المواقيت عالمياً)
  geolocator: ^13.0.2
  geocoding: ^4.0.0
  
  # Local Storage & Database
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  
  # Background Tasks & Audio
  workmanager: ^0.9.0+3
  audioplayers: ^5.2.1
  
  # UI Helpers
  scrollable_positioned_list: ^0.3.8
  xml: ^6.5.0
  device_info_plus: ^12.1.0
  change_app_package_name: ^1.0.2

  # Local packages
  digital_tasbih:
    path: ./packages/digital_tasbih
  csc_picker_plus: ^0.0.3
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi-Regular.ttf
        - asset: assets/fonts/ReemKufi-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: UthmanTN
      fonts:
        - asset: assets/fonts/UthmanTN1-Regular.ttf